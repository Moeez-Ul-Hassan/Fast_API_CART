<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Architecture Visualizer</title>
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Courier New', Courier, monospace; background-color: #121212; color: #00ff00; }
        .panel { flex: 1; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .left-panel { border-right: 2px solid #333; background-color: #1a1a1a; max-width: 450px;}
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; color: #fff; text-transform: uppercase; font-size: 18px;}
        h3 { color: #888; margin-top: 25px; margin-bottom: 10px; font-size: 14px;}
        button { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #222; color: #fff; border: 1px solid #444; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: left; font-size: 13px;}
        button:hover { background: #444; border-color: #00ff00; }
        .method { display: inline-block; width: 55px; font-weight: bold; }
        .post { color: #00ff00; } .get { color: #00aaff; } .put, .patch { color: #ffaa00; } .delete { color: #ff0055; }
        #flow-output { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
        .python-code { background: #000; padding: 15px; border-left: 3px solid #00aaff; color: #ddd; margin: 15px 0; overflow-x: auto;}
        .json-res { background: #000; padding: 15px; border-left: 3px solid #00ff00; color: #ddd; margin: 15px 0; overflow-x: auto;}
        .flow-step { color: #ffaa00; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="panel left-panel">
        <h2>System Controls</h2>
        
        <h3>--- Users ---</h3>
        <button onclick="runApi('POST', '/users/', ['email', 'name'], `@app.post('/users/')\ndef create_user(user: UserCreate, db: Session):...`)">
            <span class="method post">POST</span> Create User
        </button>
        <button onclick="runApi('GET', '/users/', null, `@app.get('/users/')\ndef get_users(db: Session):...`)">
            <span class="method get">GET</span> Get All Users
        </button>
        <button onclick="runApi('GET', '/users/{user_id}', null, `@app.get('/users/{user_id}')\ndef get_user(user_id: int, db: Session):...`)">
            <span class="method get">GET</span> Get User by ID
        </button>

        <h3>--- Products ---</h3>
        <button onclick="runApi('POST', '/products/', ['name', 'price', 'stock'], `@app.post('/products/')\ndef create_product(product: ProductCreate, db: Session):...`)">
            <span class="method post">POST</span> Create Product
        </button>
        <button onclick="runApi('GET', '/products/', null, `@app.get('/products/')\ndef get_products(db: Session):...`)">
            <span class="method get">GET</span> Get All Products
        </button>
        <button onclick="runApi('PATCH', '/products/{product_id}/stock', ['stock'], `@app.patch('/products/{product_id}/stock')\ndef update_stock(product_id: int, data: StockUpdate, db: Session):...`)">
            <span class="method patch">PATCH</span> Update Stock
        </button>

        <h3>--- Carts & Items ---</h3>
        <button onclick="runApi('POST', '/users/{user_id}/cart/', null, `@app.post('/users/{user_id}/cart/')\ndef create_cart(user_id: int, db: Session):...`)">
            <span class="method post">POST</span> Create Cart
        </button>
        <button onclick="runApi('GET', '/cart/{cart_id}', null, `@app.get('/cart/{cart_id}')\ndef get_cart(cart_id: int, db: Session):...`)">
            <span class="method get">GET</span> Get Cart Details
        </button>
        <button onclick="runApi('POST', '/cart/{cart_id}/items/', ['product_id', 'quantity'], `@app.post('/cart/{cart_id}/items/')\ndef add_item_to_cart(cart_id: int, item: ItemAdd, db: Session):...`)">
            <span class="method post">POST</span> Add Item to Cart
        </button>
        <button onclick="runApi('POST', '/cart/{cart_id}/checkout', null, `@app.post('/cart/{cart_id}/checkout')\ndef checkout_cart(cart_id: int, db: Session):...`)">
            <span class="method post">POST</span> Checkout
        </button>
        <button onclick="runApi('DELETE', '/cart/{cart_id}', null, `@app.delete('/cart/{cart_id}')\ndef delete_cart(cart_id: int, db: Session):...`)">
            <span class="method delete">DELETE</span> Delete Cart
        </button>
    </div>

    <div class="panel right-panel">
        <h2>Live Architecture Flow</h2>
        <div id="flow-output">Awaiting Request...<br><br></div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const output = document.getElementById('flow-output');

        async function runApi(method, urlTemplate, bodyFields, pythonCode) {
            output.innerHTML = ""; // Clear screen
            let url = urlTemplate;
            let bodyData = null;

            // 1. Dynamic Prompts for URL parameters (e.g., {user_id})
            const urlMatches = url.match(/\{([^}]+)\}/g);
            if (urlMatches) {
                for (let match of urlMatches) {
                    let paramName = match.replace(/[{}]/g, '');
                    let val = prompt(`Enter value for URL Parameter [${paramName}]:`);
                    if (val === null || val === "") return; // Cancelled
                    url = url.replace(match, val);
                }
            }

            // 2. Dynamic Prompts for JSON Body parameters
            if (bodyFields && bodyFields.length > 0) {
                bodyData = {};
                for (let field of bodyFields) {
                    let val = prompt(`Enter value for JSON field [${field}]:`);
                    if (val === null || val === "") return; // Cancelled
                    // Auto convert numbers
                    bodyData[field] = isNaN(val) ? val : Number(val); 
                }
            }

            // 3. Clear backend flow logs
            await fetch(`${API_BASE}/flow`, { method: 'DELETE' });

            // 4. Display the Python Code that is about to run
            output.innerHTML += `<div style="color: #fff; font-weight:bold;">1. FastAPI Route Triggered:</div>`;
            output.innerHTML += `<div class="python-code">${pythonCode}</div>`;

            // 5. Fire Request
            const options = { method: method, headers: { 'Content-Type': 'application/json' } };
            if (bodyData) {
                options.body = JSON.stringify(bodyData);
                output.innerHTML += `<div style="color: #fff; font-weight:bold;">2. JSON Payload Sent:</div>`;
                output.innerHTML += `<div class="json-res">${JSON.stringify(bodyData, null, 2)}</div>`;
            }

            try {
                const response = await fetch(API_BASE + url, options);
                let resData = null;
                if (response.status !== 204) {
                    resData = await response.json();
                }

                // 6. Fetch Flow Logs from Backend
                const flowRes = await fetch(`${API_BASE}/flow`);
                const flowData = await flowRes.json();
                
                output.innerHTML += `<div style="color: #fff; font-weight:bold; margin-top:20px;">3. Backend Execution Steps:</div>`;
                flowData.forEach(step => {
                    output.innerHTML += `<div class="flow-step">${step}</div>`;
                });

                // 7. Display Final Output
                output.innerHTML += `<div style="color: #fff; font-weight:bold; margin-top:20px;">4. Server Response (HTTP ${response.status}):</div>`;
                output.innerHTML += `<div class="json-res">${resData ? JSON.stringify(resData, null, 2) : 'No Content (204)'}</div>`;

            } catch (err) {
                output.innerHTML += `<br><span style="color:red">Server Error. Is Uvicorn running?</span>`;
            }
        }
    </script>
</body>
</html>
